<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSUN Career Center Raffle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #boot-status {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem;
        font-family: system-ui, -apple-system, sans-serif;
        color: #4a4458;
        text-align: center;
      }
      #boot-status pre {
        max-width: 44rem;
        padding: 1rem;
        background: #fdf0f2;
        color: #b42318;
        border-radius: 0.5rem;
        font-size: 0.8rem;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-status"><span>Loading raffle…</span></div>
    </div>
    <script>
      // Surface load failures instead of leaving a blank white screen.
      window.addEventListener('error', function (event) {
        var node = document.getElementById('boot-status');
        if (!node) return;
        node.innerHTML =
          '<strong>The app failed to load.</strong><pre>' +
          String((event && (event.message || event.type)) || 'Unknown error') +
          '</pre>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
